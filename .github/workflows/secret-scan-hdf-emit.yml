name: Secret scan HDF emit (TruffleHog)

# Evidence producer, companion to the secret-scan.yml gate (#13).
#
# The gate answers "are there secrets" and stops. This converts the finding set
# to HDF so it joins the same evidence stream as SAST, SCA and the InSpec
# results — without it, a secret finding in this repository would exist in a
# workflow log and nowhere else.
#
# Copied from risk-sentinel/dev-sec-ops-baseline, where it was written
# self-contained precisely so it could be. Both tools install INLINE rather than
# through repo-local scripts (sparc-dast keeps hdf/install-hdf-cli.sh and
# hdf/emit_secrets.sh): fourteen repositories need this identical file, and a
# script dependency would mean fourteen copies to keep in step.
#
# Only the repository slug differs between copies. If this file needs a change,
# it needs the same change in all fourteen — which is an argument for promoting
# it to a reusable workflow in container-build-sign once it has settled.
#
# Never runs on pull_request: a fork PR would run this with write-ish intent,
# and the evidence stream should only reflect what actually landed on main.
#
# ---- Two behaviours worth understanding before editing ----------------------
#
# VERIFIED-ONLY, matching the gate. Unverified capture is deliberately avoided:
# TruffleHog's regex detectors flag any 40-hex string as a candidate credential,
# and this repository is full of them — every SHA-pinned action ref. Recording
# those would poison the evidence with false positives that then need triaging
# out of the POA&M.
#
# ZERO FINDINGS IS A SKIP, not a failure and not an empty artifact. `hdf convert`
# errors on empty input, and a clean repository has nothing to record. This is
# the normal case here, which is exactly why the gap went unnoticed for so long:
# a clean repo and an unbuilt pipeline look identical from outside.

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 12 * * 1'   # weekly, offset from the gate's daily run
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # AWS OIDC for the S3 emit

jobs:
  emit:
    name: Convert + emit secrets HDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install TruffleHog (pinned + checksum-verified)
        run: |
          set -euo pipefail
          # --proto/--proto-redir pin the transport to HTTPS. `curl -L` alone
          # follows a redirect to plain HTTP, and both the tarball AND its
          # checksums are fetched this way — so an attacker who can downgrade
          # the connection serves a matching pair and the checksum check proves
          # nothing. The verification is only as good as the channel it arrives
          # on.
          ver="3.96.0"
          base="https://github.com/trufflesecurity/trufflehog/releases/download/v${ver}"
          tar="trufflehog_${ver}_linux_amd64.tar.gz"
          curl -sSfL --proto '=https' --proto-redir '=https' "${base}/${tar}" -o "${tar}"
          curl -sSfL --proto '=https' --proto-redir '=https' "${base}/trufflehog_${ver}_checksums.txt" -o checksums.txt
          grep " ${tar}\$" checksums.txt | sha256sum -c -
          tar -xzf "${tar}" trufflehog
          sudo install -m 0755 trufflehog /usr/local/bin/trufflehog
          trufflehog --version

      - name: Install hdf-cli (pinned + checksum-verified)
        run: |
          set -euo pipefail
          # 3.4.1 — the version sparc-auditor:v0.5.0 ships. Deliberately NOT
          # 3.3.2 as sparc-dast pins: aws-config#5 found older hdf CLI output
          # reaching the POA&M with tags.nist absent on every control, and 3.4.1
          # is the version confirmed to carry attribution end to end.
          ver="3.4.1"
          base="https://github.com/mitre/hdf-libs/releases/download/v${ver}"
          tar="hdf_${ver}_linux_amd64.tar.gz"
          curl -sSfL --proto '=https' --proto-redir '=https' "${base}/${tar}" -o "${tar}"
          curl -sSfL --proto '=https' --proto-redir '=https' "${base}/checksums.txt" -o checksums.txt
          grep " ${tar}\$" checksums.txt | sha256sum -c -
          tar -xzf "${tar}" hdf
          sudo install -m 0755 hdf /usr/local/bin/hdf
          hdf version

      - name: TruffleHog scan -> JSONL
        id: tf
        run: |
          set -euo pipefail
          # Findings go to stdout as JSONL; logs to stderr (dropped). The fixture
          # is excluded — it exists to prove the GATE fires, and recording a
          # synthetic credential as real evidence would be worse than useless.
          #
          # Do NOT fold the JSONL into a JSON array: hdf convert auto-detects the
          # raw TruffleHog JSONL, and wrapping it breaks detection.
          trufflehog filesystem . --json --only-verified \
            --exclude-paths=.trufflehog-exclude-paths > trufflehog.json 2>/dev/null || true
          n="$(grep -c . trufflehog.json || true)"
          echo "findings=$n"
          echo "findings=$n" >> "$GITHUB_OUTPUT"

      - name: No findings — skip (clean)
        if: steps.tf.outputs.findings == '0'
        run: echo "::notice::TruffleHog found no verified secrets — nothing to convert or emit (clean)."

      - name: Convert -> label -> validate
        if: steps.tf.outputs.findings != '0'
        env:
          OUT: out/rs-aws-ecs-fargate-baseline-trufflehog-hdf.json
        run: |
          set -euo pipefail
          mkdir -p out
          hdf convert trufflehog.json -o "$OUT"
          # Provenance labels: without them the HDF says what was found but not
          # where or when, and an evidence file that cannot be traced to a commit
          # is not evidence.
          hdf label set "$OUT" \
            scanner=trufflehog \
            target=rs-aws-ecs-fargate-baseline \
            "repo=${GITHUB_REPOSITORY}" \
            "commit=${GITHUB_SHA}" \
            "ref=${GITHUB_REF}" \
            "run_id=${GITHUB_RUN_ID}"
          hdf validate "$OUT" -q
          echo "OK: $OUT"

      - name: Upload HDF artifact (evidence even without S3)
        if: steps.tf.outputs.findings != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rs-aws-ecs-fargate-baseline-trufflehog-hdf
          path: out/rs-aws-ecs-fargate-baseline-trufflehog-hdf.json
          if-no-files-found: error
          retention-days: 30

      - name: Configure AWS credentials (OIDC)
        id: aws
        if: steps.tf.outputs.findings != '0'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.PROFILE_EMIT_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Emit HDF to S3
        # Gated on the credential step SUCCEEDING, not merely running.
        #
        # The evidence-bucket rights belong to sparc-validate, not to the
        # profile repositories. Two consequences, neither of them a defect here:
        #
        #   - INCLUDED from sparc-validate, the emit works: a reusable workflow
        #     mints its OIDC token as the CALLER, which already holds the grant.
        #   - STAND-ALONE, PROFILE_EMIT_ARN resolves empty, the credential step
        #     is skipped and S3 with it. The converted HDF still uploads as a
        #     BUILD ARTIFACT, so the evidence exists and is collectable either
        #     way.
        #
        # Giving these repositories their own emit — and the s3:GetObject +
        # kms:Decrypt a stand-alone evidence_store scan needs to READ the
        # bucket — is an IAM change in sparc-iac, tracked there. Until then the
        # build artifact is the delivery mechanism.
        if: steps.tf.outputs.findings != '0' && steps.aws.outcome == 'success'
        env:
          BUCKET: ${{ secrets.COMPLIANCE_S3_BUCKET }}
          BOUNDARY: ${{ vars.EVIDENCE_BOUNDARY || 'sparc' }}
        run: |
          set -euo pipefail
          # Canonical layout: <boundary>/<date|latest>/<repo>/<source>/<source>-hdf.json
          d="$(date -u +%Y-%m-%d)"
          for slot in "$d" latest; do
            aws s3 cp out/rs-aws-ecs-fargate-baseline-trufflehog-hdf.json \
              "s3://${BUCKET}/${BOUNDARY}/${slot}/rs-aws-ecs-fargate-baseline/trufflehog/trufflehog-hdf.json"
          done
