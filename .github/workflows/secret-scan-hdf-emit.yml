name: Secret scan HDF emit (TruffleHog)

# Caller for the reusable secret-scan-hdf.yml published by the DevSecOps baseline
# (dev-sec-ops-baseline#21).
#
# Companion to secret-scan.yml, which is the GATE. The gate answers "are there
# secrets" and stops; this converts the result to HDF so it joins the same
# evidence stream as SAST, SCA and the InSpec results.
#
# ---- Why this replaced a 184-line copy --------------------------------------
#
# The copy skipped the upload entirely when TruffleHog found nothing. A clean
# scan is the normal case, so this repository emitted nothing, ever — and an
# empty prefix is byte-for-byte what a broken pipeline leaves. The profile read
# it as unevidenced, correctly: 20 of 21 repositories were failing secrets
# coverage for a defect in the recording rather than the scanning.
#
# The reusable emits a one-control HDF recording the execution on a clean run,
# so "we scanned it and it was clean" is finally something the evidence can say.
#
# It is a caller, not a copy, because fixing the copy cost one PR per
# repository. The next fix costs one in total.
#
# Never runs on pull_request: a fork PR would run this with write-ish intent,
# and the evidence stream should only reflect what landed on the default branch.

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 12 * * 1'   # weekly, offset from the gate's daily run
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  emit:
    uses: risk-sentinel/dev-sec-ops-baseline/.github/workflows/secret-scan-hdf.yml@949e54cbbf42fafe79903c4329c11e9146dae87d  # v0.4.0
    with:
      boundary: ${{ vars.EVIDENCE_BOUNDARY || 'sparc' }}
    secrets:
      S3_EMIT_ROLE_ARN: ${{ secrets.RS_AWS_ECS_FARGATE_BASELINE_EMIT_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      COMPLIANCE_S3_BUCKET: ${{ secrets.COMPLIANCE_S3_BUCKET }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
