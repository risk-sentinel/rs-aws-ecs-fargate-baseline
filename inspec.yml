name: rs-aws-ecs-fargate-v1r1
title: AWS ECS Fargate Security Baseline
maintainer: Risk Sentinel
copyright: Risk Sentinel
copyright_email: support@risk-sentinel.org
license: Apache-2.0
summary: |
  Custom Tier-2 InSpec baseline for Amazon ECS on AWS Fargate.

  No CIS or DISA STIG benchmark exists for ECS/Fargate. Controls are
  anchored, per control, to: NIST SP 800-53 r5; AWS Foundational Security
  Best Practices (ECS.*); the AWS ECS best-practices guide; NIST SP
  800-190; and the DISA Container Platform SRG (SRG-CTR V2R4) for
  DoD-authoritative CCIs. CCI-backed task-definition rules harvested from
  CIS AWS Compute v1.1.0 (§3 / §11.1) are re-expressed here so the profile
  stands alone as a complete Fargate baseline.

  In the Fargate model the host OS, container runtime, and orchestrator
  control plane are AWS-managed (inherited via AWS FedRAMP/DoD ATO); this
  profile asserts only the customer-configurable projection — task
  definitions, services, clusters, IAM task/execution roles, network
  configuration, and the ECR repositories backing task images. See the
  shared-responsibility matrix in README.md.

  Targets AWS Commercial (aws) and AWS GovCloud non-DoD (aws-us-gov).
  Built for any consumer; behaviour tuned via inputs.
version: 0.1.0
inspec_version: '>= 5.0'

supports:
  - platform: aws

depends:
  - name: inspec-aws
    git: https://github.com/inspec/inspec-aws.git
    branch: main

inputs:
  - name: aws_partition
    type: string
    value: aws
    description: Target partition (aws / aws-us-gov).
  - name: alb_strong_ssl_policies
    type: array
    value:
      - ELBSecurityPolicy-TLS13-1-2-2021-06
      - ELBSecurityPolicy-TLS13-1-2-Res-2021-06
      - ELBSecurityPolicy-TLS13-1-2-Ext1-2021-06
      - ELBSecurityPolicy-TLS13-1-2-Ext2-2021-06
      - ELBSecurityPolicy-TLS13-1-3-2021-06
      - ELBSecurityPolicy-FS-1-2-Res-2020-10
      - ELBSecurityPolicy-FS-1-2-Res-2019-08
      - ELBSecurityPolicy-FS-1-2-2019-08
      - ELBSecurityPolicy-TLS-1-2-2017-01
      - ELBSecurityPolicy-TLS-1-2-Ext-2018-06
    description: >-
      Approved ALB HTTPS-listener SSL policies (TLS 1.2+; EF-11.2). Any HTTPS
      listener using a policy outside this set fails. Default is the modern
      strong set; legacy TLS 1.0/1.1 (2015/2016) policies are intentionally
      excluded.
  - name: trusted_image_registries
    type: array
    value: []
    description: >-
      Allowed image-registry prefixes (e.g. ECR repo URIs). Empty = the
      trusted-registry control fails closed (consumer must declare).
  - name: ecs_exec_allowed_services
    type: array
    value: []
    description: >-
      Service ARNs/names permitted to have ECS Exec enabled. Any other
      service with enableExecuteCommand=true fails EF-7.1.
  - name: required_tag_keys
    type: array
    value: []
    description: Governance tag keys required on services/clusters/task defs.
  - name: require_image_digest_pinning
    type: boolean
    value: true
    description: Require container images pinned by @sha256 digest (EF-1.1).
  - name: max_image_finding_severity
    type: string
    value: HIGH
    description: >-
      Highest ECR scan-finding severity tolerated before EF-1.7 fails
      (one of INFORMATIONAL, LOW, MEDIUM, HIGH, CRITICAL).
  - name: allowed_added_capabilities
    type: array
    value: ['NET_BIND_SERVICE']
    description: Linux capabilities permitted in linuxParameters.capabilities.add.
  - name: scan_regions
    type: array
    value: []
    description: Region allowlist for region-scoped checks; empty = current region.
  - name: cert_expiry_warning_days
    type: numeric
    value: 30
    description: >-
      Minimum days an ALB HTTPS-listener ACM certificate must have before
      expiry (EF-11.7). A cert with fewer days remaining fails.
  - name: min_log_retention_days
    type: numeric
    value: 30
    description: >-
      Minimum retention (days) required on the CloudWatch Logs groups backing
      awslogs-driver containers (EF-8.7). A never-expire or shorter group fails.
  - name: tls_termination
    type: string
    value: alb
    description: >-
      Where this workload terminates TLS, for the distributed-TLS model
      (EF-12): 'alb' (the ALB terminates; EF-11 is authoritative), 'proxy'
      (a reverse-proxy sidecar terminates; EF-12.1 enforces proxy + TLS
      material, cipher config validated by cis-nginx), or 'both'.
  # ---- document_attestation evidence-class bases ----
  - name: leveraged_evidence_base
    type: string
    value: ''
    description: Base for leveraged-SYSTEM AWS authorizations (FedRAMP High / DoD SRG / SOC 2). The EF-9 AWS-inherited SRG-domain controls resolve their evidence manifest under this base.
  - name: policy_provider_base
    type: string
    value: ''
    description: Base for policy-PROVIDER documents the boundary leverages.
  - name: boundary_docs_base
    type: string
    value: ''
    description: Base for the boundary's OWN governance docs (e.g. EF-10.4 image-build / SBOM-currency record).
  - name: inherited_evidence_uri
    type: string
    value: ''
    description: Shared override URI for the EF-9 AWS-inherited controls. Empty -> resolves via leveraged_evidence_base to the aws-fargate-fedramp manifest; both unset -> Skip.
  - name: leveraged_evidence_max_age_days
    type: numeric
    value: 365
    description: Staleness window (days) for the AWS authorization evidence manifest.
  - name: attestation_max_age_days
    type: numeric
    value: 365
    description: Staleness window (days) for boundary attestations (EF-10.4).
